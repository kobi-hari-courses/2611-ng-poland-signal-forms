<label>
  <span class="field-label">
    {{ label() }}
    @if (required()) {
      <span class="required-marker" aria-hidden="true">*</span>
    }
  </span>
  <ng-content />
</label>

<div class="tools">
  @if(copyable()) {
    <button utility type="button" (click)="copyToClipboard()">
      <span class="copy-icon"></span>      
    </button>
  }

  @if( canBeFilledByAI()) {
    <button utility type="button" (click)="fillByAI()">
      @if(aiResource.isLoading()) {
        <span class="spinner"></span>
      } @else {
        <span class="ai-icon"></span>
      }
    </button>

  }
</div>

@for (hint of hints(); track $index) {
  <small class="field-hint">{{ hint }}</small>
}

@if (touched()) {
  @for (error of errors(); track error.kind) {
    <span class="field-error" role="alert">{{ error.message }}</span>
  }
}
