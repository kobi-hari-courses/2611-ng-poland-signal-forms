<h1>Speaker proposal</h1>

<form [formRoot]="proposalForm">
  <app-field-wrapper label="Session type">
    <select [formField]="proposalForm.sessionType">
      <option value="lightning">Lightning talk</option>
      <option value="full">Full session</option>
    </select>
  </app-field-wrapper>

  <app-field-wrapper label="Duration (minutes)">
    <input type="number" [formField]="proposalForm.durationMinutes" />
  </app-field-wrapper>

  <app-field-wrapper label="Long bio">
    <textarea rows="8" [formField]="proposalForm.longBio"></textarea>
  </app-field-wrapper>

  <app-field-wrapper label="Short bio">
    <textarea rows="4" [formField]="proposalForm.shortBio"></textarea>
  </app-field-wrapper>

  <app-field-wrapper label="Organizer notes">
    <textarea rows="2" [formField]="proposalForm.organizerNotes"></textarea>
  </app-field-wrapper>
</form>
